name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check the signing password
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_PASSWORD (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FriendLamp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FriendLamp-apk
          path: FriendLamp.apk

      # A release gives the APK a permanent download link:
      # https://github.com/<owner>/friendlamp/releases/latest/download/FriendLamp.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" FriendLamp.apk
          --title "FriendLamp build ${{ github.run_number }}"
          --notes "Install: download the APK on the phone and open it."
          --latest
